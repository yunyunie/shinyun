<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab &mdash; Teh Shin Yun</title>
<meta name="description" content="Teh Shin Yun — cross-market creator ecosystem and product operations.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<nav class="nav"><div class="nav-in">
  <a class="brand" href="index.html"><span class="mark"></span><span data-i18n="brand">Shin Yun</span></a>
  <div class="menu"><a href="index.html" data-sec="home" data-i18n="nav.home">Home</a><a href="index.html#work" data-sec="work" data-i18n="nav.work">work</a><a href="index.html#journey" data-sec="journey" data-i18n="nav.journey">journey</a><a href="index.html#lab" data-sec="lab" data-i18n="nav.lab">lab</a><a href="index.html#notes" data-sec="notes" data-i18n="nav.notes">notes</a></div>
  <button class="btn" onclick="dropBadge()" data-i18n="nav.contact">Contact</button>
  <div class="langbox">
    <button class="langbtn" onclick="toggleLangMenu()" aria-haspopup="true"><span id="langLabel">EN</span> &#9662;</button>
    <div class="langmenu" id="langMenu">
      <button onclick="pickLang('en')">English</button>
      <button onclick="pickLang('zh')">&#20013;&#25991;</button>
      <button onclick="pickLang('ko')">&#54620;&#44397;&#50612;</button>
    </div>
  </div>
</div></nav>
<div class="wrap">
  <div class="phead">
    <div class="kicker" data-i18n="lab.eyebrow"></div>
    <h1 data-i18n="lab.title">Lab</h1>
    <p class="sub" data-i18n="labp.intro"></p>
    <p class="sub" style="font-size:17px;margin-top:14px" data-i18n="labp.sup"></p>
  </div>

  <section class="sec">
    <div class="sec-idx" data-i18n="labp.s1"></div>
    <h2 style="font-size:31px" data-i18n="lab.a.title"></h2>
    <div class="lab-split" style="margin-top:26px">
      <div>
        <p style="color:var(--ink-2);margin:0" data-i18n="lab.a.desc"></p>
        <div style="margin-top:30px">
          <strong data-i18n="p.pubg.title"></strong>
          <span class="status" data-i18n="st.prototype"></span>
          <p style="font-size:14px;color:var(--ink-3);margin:6px 0 0" data-i18n="p.pubg.note"></p>
          <p style="color:var(--ink-2);margin-top:12px" data-i18n="p.pubg.desc"></p>
        </div>
        <div style="margin-top:36px">
          <div class="sec-idx" style="color:var(--ink-3)" data-i18n="labp.testing"></div>
          <div class="flow"><b data-i18n="labp.t1"></b><b data-i18n="labp.t2"></b><b data-i18n="labp.t3"></b><b data-i18n="labp.t4"></b><b data-i18n="labp.t5"></b></div>
        </div>
      </div>
      <div class="sheet">
        <img src="assets/lab/ai-visual/pubg-mobile/01.jpg" loading="lazy" data-i18n-alt="p.pubg.title" alt=""><img src="assets/lab/ai-visual/pubg-mobile/02.jpg" loading="lazy" data-i18n-alt="p.pubg.title" alt=""><img src="assets/lab/ai-visual/pubg-mobile/03.jpg" loading="lazy" data-i18n-alt="p.pubg.title" alt=""><img src="assets/lab/ai-visual/pubg-mobile/04.jpg" loading="lazy" data-i18n-alt="p.pubg.title" alt="">
      </div>
    </div>
    <div style="margin-top:48px">
      
      <div class="tool">
        <div>
          <h4><span data-i18n="p.aivideo.title"></span></h4>
          <p data-i18n="p.aivideo.desc"></p>
        </div>
        <span class="status" data-i18n="st.building"></span>
      </div>
      
      <div class="tool">
        <div>
          <h4><span data-i18n="p.minigame.title"></span></h4>
          <p data-i18n="p.minigame.desc"></p>
        </div>
        <span class="status" data-i18n="st.exploring"></span>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-idx" data-i18n="labp.s2"></div>
    <h2 style="font-size:31px" data-i18n="lab.b.title"></h2>
    <p class="intro" style="color:var(--ink-2);max-width:52ch;margin-top:14px" data-i18n="lab.b.desc"></p>
    
      <div class="tool">
        <div>
          <h4><span data-i18n="p.dash.title"></span></h4>
          <p data-i18n="p.dash.desc"></p>
          <div style="margin-top:15px;font-size:15.5px;color:var(--ink-2)">
            <p style="margin:0 0 8px"><b data-i18n="labp.problem"></b>&nbsp;<span data-i18n="p.dash.problem"></span></p>
            <p style="margin:0"><b data-i18n="labp.built"></b>&nbsp;<span data-i18n="p.dash.built"></span></p>
            <p style="margin:8px 0 0"><b data-i18n="labp.why"></b>&nbsp;<span data-i18n="p.dash.why"></span></p></div>
        </div>
        <span class="status ship" data-i18n="st.shipped"></span>
      </div>
    
      <div class="tool">
        <div>
          <h4><span data-i18n="p.market.title"></span></h4>
          <p data-i18n="p.market.desc"></p>
          <div style="margin-top:15px;font-size:15.5px;color:var(--ink-2)">
            <p style="margin:0 0 8px"><b data-i18n="labp.problem"></b>&nbsp;<span data-i18n="p.market.problem"></span></p>
            <p style="margin:0"><b data-i18n="labp.built"></b>&nbsp;<span data-i18n="p.market.built"></span></p></div>
        </div>
        <span class="status" data-i18n="st.beta"></span>
      </div>
    
      <div class="tool">
        <div>
          <h4><span data-i18n="p.home.title"></span></h4>
          <p data-i18n="p.home.desc"></p>
          <div style="margin-top:15px;font-size:15.5px;color:var(--ink-2)">
            <p style="margin:0 0 8px"><b data-i18n="labp.problem"></b>&nbsp;<span data-i18n="p.home.problem"></span></p>
            <p style="margin:0"><b data-i18n="labp.built"></b>&nbsp;<span data-i18n="p.home.built"></span></p></div>
        </div>
        <span class="status" data-i18n="st.beta"></span>
      </div>
    
      <div class="tool">
        <div>
          <h4><span data-i18n="p.commerce.title"></span></h4>
          <p data-i18n="p.commerce.desc"></p>
        </div>
        <span class="status" data-i18n="st.concept"></span>
      </div>
    
      <div class="tool">
        <div>
          <h4><span data-i18n="p.job.title"></span></h4>
          <p data-i18n="p.job.desc"></p>
        </div>
        <span class="status" data-i18n="st.concept"></span>
      </div>
  </section>

  <section class="sec">
    <div class="sec-idx" data-i18n="labp.s3"></div>
    <h2 style="font-size:31px" data-i18n="lab.c.title"></h2>
    <p class="intro" style="color:var(--ink-2);max-width:52ch;margin-top:14px" data-i18n="lab.c.desc"></p>
    
      <div class="tool">
        <div>
          <h4><span data-i18n="p.effects.title"></span></h4>
          <p data-i18n="p.effects.desc"></p>
        </div>
        <span class="status" data-i18n="st.exploring"></span>
      </div>
    
      <div class="tool">
        <div>
          <h4><span data-i18n="p.sticker.title"></span></h4>
          <p data-i18n="p.sticker.desc"></p>
        </div>
        <span class="status" data-i18n="st.exploring"></span>
      </div>
    <p class="quiet quiet-lg" style="margin-top:78px">
      <span data-i18n="lab.still1"></span><br><span data-i18n="lab.still2"></span></p>
  </section>

  <footer class="foot"><span data-i18n="foot.copy">&#169; 2026 Shin Yun.</span></footer>
</div>
<div class="veil" id="veil" onclick="closeBadge()">
  <div class="hang" id="hang" onclick="event.stopPropagation()">
    <div class="lany">CREATE &middot; CONNECT &middot; GROW</div>
    <div class="clip"></div>
    <div class="badge">
      <div class="top"><span class="mark" style="width:15px;height:19px;border-width:1.2px"></span><span data-i18n="brand">Shin Yun</span></div>
      <div class="ph-img"><img src="assets/avatar-badge.png" alt="Teh Shin Yun"></div>
      <h3 data-i18n="badge.name">Teh Shin Yun</h3>
      <p class="role"><span data-i18n="badge.r1"></span><br><span data-i18n="badge.r2"></span></p>
      <div class="mail"><a href="mailto:shin.yun.9697@gmail.com">shin.yun.9697@gmail.com</a></div>
    </div>
  </div>
</div>

<div class="lveil" id="lveil">
  <div class="lcard">
    <h3 data-i18n="lang.title">Choose a language</h3>
    <p data-i18n="lang.desc"></p>
    <div class="lopt">
      <button onclick="pickLang('en')">English</button>
      <button onclick="pickLang('zh')">&#20013;&#25991;</button>
      <button onclick="pickLang('ko')">&#54620;&#44397;&#50612;</button>
    </div>
    <div class="lrow">
      <button class="btn" onclick="pickLang('en')" data-i18n="lang.continue">Continue in English</button>
      <button class="skip" onclick="pickLang('en')" data-i18n="lang.close">Close</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img src="" alt=""></div>

<script src="assets/i18n.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
